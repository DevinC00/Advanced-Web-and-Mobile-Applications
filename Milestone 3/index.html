
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milestone 3 Book Search SPA</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="combinedFeatures.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-container">

            <h1>Milestone 3 Book Search SPA</h1>

            <nav aria-label="Main navigation">
                <button type="button" id="homeNavBtn" class="home-btn">
                    Home
                </button>

                <button type="button" id="searchNavBtn" class="nav-btn">
                    Search Books
                </button>
            </nav>

        </div>
    </header>

    <main>

        <!-- General Search Bar -->
        <section id="searchSection" class="search-section">

            <form id="searchForm">

                <div class="search-input">
                    <label for="searchInput">
                        Search Books by Title, Author, or Keyword
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="e.g., The Lord of the Rings, George Orwell..."
                        required
                    >
                </div>

                <div class="results-limit">
                    <label for="limitSelect">Results Per Page</label>

                    <select id="limitSelect">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="40">40</option>
                        <option value="50">50 (Max)</option>
                    </select>
                </div>

                <div class="search-button-container">
                    <button type="submit" id="submitSearchBtn">
                        Search
                    </button>
                </div>

            </form>

        </section>

        <!-- VIEW 1: Home + Featured Collection -->
        <section id="homeView">

            <div class="section-heading">
                <h2>Featured Fantasy Books</h2>
                <p>My collection of fantasy books.</p>
            </div>

            <div id="featuredLoading" class="loading" role="status" aria-live="polite">
                Loading featured books...
            </div>

            <div id="featuredGrid" class="book-grid"></div>

            <p id="featuredError" class="error hidden" role="alert"></p>

        </section>

        <!-- VIEW 2: Search Results -->
        <section id="searchView" class="hidden">

            <div class="section-heading">
                <h2>Search Results</h2>
                <p id="searchSummary"></p>
            </div>

            <div id="searchStatus" class="status hidden" role="status" aria-live="polite"></div>

            <div id="resultsGrid" class="book-grid"></div>

            <!-- Pagination -->
            <nav id="paginationControls" class="pagination hidden" aria-label="Search result pagination">

                <button type="button" id="prevBtn">
                    ← Previous
                </button>

                <span id="pageIndicator">Page 1</span>

                <button type="button" id="nextBtn">
                    Next →
                </button>

            </nav>

        </section>

        <!-- VIEW 3: Book Details -->
        <section id="detailsView" class="hidden">

            <div class="back-container">
                <button type="button" id="backBtn">
                    ← Back
                </button>
            </div>

            <div id="detailsStatus" class="status hidden" role="status" aria-live="polite"></div>

            <article id="bookDetailsContainer" class="book-details hidden">

                <div class="details-content">

                    <!-- Book Cover -->
                    <div class="book-cover-container">

                        <div class="book-cover">
                            <img
                                id="bookCover"
                                src="https://placehold.co/400x600?text=No+Cover"
                                alt="Book Cover"
                                loading="lazy"
                            >
                        </div>

                    </div>

                    <!-- Book Information -->
                    <div class="book-information">

                        <div class="information-content">

                            <div>
                                <h2 id="bookTitle"></h2>
                            </div>

                            <div>
                                <h4>Work ID</h4>
                                <p id="bookWorkId"></p>
                            </div>
                            <div>
                                <h4 class="details-label">Author(s)</h4>
                                <div id="bookAuthors" class="book-authors"></div>
                            </div>
                            <div>
                                <h4 class="details-label">Subjects</h4>
                                <ul id="bookSubjects" class="book-subjects"></ul>
                            </div>
                            <div>
                                <h4>Description</h4>
                                <p id="bookDescription"></p>
                            </div>

                            <div class="library-link-container">
                                <a
                                    id="openLibraryLink"
                                    href="#"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    View on Open Library
                                </a>
                            </div>

                        </div>

                    </div>

                </div>

            </article>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <div>
            Milestone 3 Book Search SPA | Powered by Open Library
        </div>
    </footer>

</body>
</html>
