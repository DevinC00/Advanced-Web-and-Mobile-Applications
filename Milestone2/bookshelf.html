<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookshelf</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="bookshelf.js" defer></script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800">

    
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">

            <div>
                <h1 class="text-3xl font-bold">My Bookshelf</h1>
            </div>

            <nav class="flex gap-3" aria-label="Main navigation">
                <a href="index.html" class="bg-white text-indigo-700 hover:bg-indigo-50 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition">
                ← Back to Search
            </a>
            </nav>

        </div>
    </header>


    <main class="max-w-6xl mx-auto px-6 py-10">

        <h2 class="text-2xl font-bold mb-6">Featured Books</h2>

        <p id="loadingMessage"
           class="text-gray-500 text-center py-10"
           role="status"
           aria-live="polite">
            Loading your bookshelf...
        </p>

        <div id="bookshelf"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>

        <p id="errorMessage"
           class="hidden text-center text-red-600 mt-6"
           role="alert">
        </p>

    </main>

</body>
</html>
