<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Library Book Finder SPA</title>
    <!-- Tailwind CSS for modern layout/styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-indigo-600 text-white shadow-md py-6">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold tracking-tight">📚 BookFinder SPA</h1>
            <p class="text-indigo-200 mt-2 text-sm">Powered by Open Library API & jQuery</p>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- Search and Filter Control Bar -->
        <section class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100">
            <form id="searchForm" onsubmit="event.preventDefault(); return false;" class="flex flex-col md:flex-row gap-4 items-end md:items-center">
                <!-- Search Input Field -->
                <div class="flex-grow w-full">
                    <label for="searchInput" class="block text-xs font-semibold uppercase text-gray-500 mb-2 tracking-wider">Search Books by Title, Author, or Keyword</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="e.g., The Lord of the Rings, George Orwell..." 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        required
                    >
                </div>
                
                <!-- Results Per Page Control Dropdown -->
                <div class="w-full md:w-48">
                    <label for="limitSelect" class="block text-xs font-semibold uppercase text-gray-500 mb-2 tracking-wider">Results Per Page</label>
                    <select 
                        id="limitSelect" 
                        class="w-full px-3 py-3 rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                    >
                        <option value="60" selected>60 (Max)</option>
                        <option value="40">40</option>
                        <option value="20">20</option>
                        <option value="10">10</option>
                    </select>
                </div>

                <!-- Submit Action Button -->
                <div class="w-full md:w-auto">
                    <button 
                        type="button" 
                        id="submitSearchBtn"
                        class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-8 py-3 rounded-lg shadow transition duration-150 ease-in-out transform active:scale-95"
                    >
                        Search
                    </button>
                </div>
            </form>
        </section>

        <!-- Status Displays (Loading Indicator, Empty States, Metrics) -->
        <div id="statusMessage" class="hidden text-center py-8">
            <!-- Dynamic Injection Zone -->
        </div>

        <!-- Book Grid Component Area -->
        <section id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Dynamic Cards injected via script -->
        </section>

        <!-- Pagination Controls Section -->
        <nav id="paginationControls" class="hidden flex justify-center items-center gap-4 mt-12 pt-6 border-t border-gray-200">
            <button 
                id="prevBtn" 
                class="px-4 py-2 border border-gray-300 rounded-md bg-white hover:bg-gray-50 font-medium text-sm disabled:opacity-50 disabled:cursor-not-allowed transition"
            >
                ← Previous
            </button>
            <span id="pageIndicator" class="text-sm font-semibold text-gray-600">
                Page 1
            </span>
            <button 
                id="nextBtn" 
                class="px-4 py-2 border border-gray-300 rounded-md bg-white hover:bg-gray-50 font-medium text-sm disabled:opacity-50 disabled:cursor-not-allowed transition"
            >
                Next →
            </button>
        </nav>
    </main>

    <!-- Footer Area -->
    <footer class="bg-gray-100 border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        &copy; 2026 SPA Book Finder. All rights reserved.
    </footer>

    <!-- jQuery CDN Core Library Deployment -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- Custom Application Logic Script Linking -->
    <script src="search_app.js"></script>
</body>
</html>
